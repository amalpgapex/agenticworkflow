[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wf"
version = "0.1.0"
description = "Definition-driven agentic workflow engine (Phase 1)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pydantic-ai-slim[bedrock,mcp]==2.54.0",
    "mcp==2.3.0",
    "temporalio==1.34.0",
    "cel-python==0.5.0",
    "pyyaml==6.0.3",
    "httpx==0.28.1",
    "boto3==1.43.108",
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    "itsdangerous==2.2.0",
    "authlib==1.8.0",
    "python-multipart==0.0.32",
    "weasyprint==70.0",
    "typer==0.27.3",
    "structlog==26.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "respx==0.23.1",
    "moto[s3,ses]==5.2.3",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "types-pyyaml==6.0.12.20260906",
    "types-boto3==1.43.108",
]

[project.scripts]
wf = "wf.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["wf.definition", "wf.expressions", "wf.engine"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-m 'not live' --cov=wf.definition --cov=wf.expressions --cov=wf.engine --cov=wf.checks --cov-fail-under=80"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: calls live AWS or Open-Meteo (deselect with -m 'not live')",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/wf/definition", "src/wf/expressions", "src/wf/engine", "src/wf/checks"]
branch = true

[tool.coverage.report]
omit = ["*/tests/*", "*/engine/worker.py"]
