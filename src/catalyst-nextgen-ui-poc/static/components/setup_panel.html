<div class="panel h-full flex flex-col overflow-hidden">
    <div x-show="leftPanelCollapsed" class="flex flex-col items-center py-8 cursor-pointer" @click="leftPanelCollapsed = false">
        <div style="writing-mode: vertical-rl;" class="text-xs font-semibold text-slate-400">
            Setup
        </div>
    </div>
    
    <!-- READ-ONLY SUMMARY VIEW (Workspace Mode) -->
    <div x-show="!leftPanelCollapsed && viewMode === 'workspace'" class="flex flex-col h-full">
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-xs font-bold uppercase text-slate-400">Configuration</h3>
            <button @click="leftPanelCollapsed = true" class="text-slate-400 hover:text-slate-600">
                ←
            </button>
        </div>
        
        <div class="flex-1 overflow-y-auto space-y-4 pr-2" style="scrollbar-width: thin;">
            <!-- Task Info -->
            <div class="bg-slate-50 rounded-lg p-3 border border-slate-200">
                <div class="text-xs font-semibold uppercase text-slate-400 mb-2">Task</div>
                <div class="flex items-start gap-2">
                    <div class="text-xl flex-shrink-0" x-text="getTaskIcon(transformations.find(t => t.key === selectedTransform))"></div>
                    <div class="flex-1 min-w-0">
                        <h4 class="text-sm font-semibold text-slate-900 mb-0.5" x-text="transformations.find(t => t.key === selectedTransform)?.name"></h4>
                        <p class="text-xs text-slate-600 leading-relaxed" x-text="transformations.find(t => t.key === selectedTransform)?.description"></p>
                    </div>
                </div>
            </div>
            
            <!-- Files Info -->
            <div x-show="uploadedFiles.length > 0 || Object.keys(labeledFiles).length > 0" class="bg-slate-50 rounded-lg p-3 border border-slate-200">
                <div class="text-xs font-semibold uppercase text-slate-400 mb-2">Files</div>
                <div class="space-y-1.5">
                    <!-- Labeled Files Display -->
                    <template x-if="currentTaskUsesLabeledFiles">
                        <div class="space-y-1.5">
                            <template x-for="(fileInput, idx) in currentTaskLabeledInputs" :key="fileInput.key">
                                <div x-show="labeledFiles[fileInput.key]" class="flex items-center gap-2 text-xs">
                                    <span class="text-base" x-text="getFileIcon(labeledFiles[fileInput.key]?.type || 'docx')"></span>
                                    <div class="flex-1 min-w-0">
                                        <div class="font-medium text-slate-900 truncate" x-text="labeledFiles[fileInput.key]?.name"></div>
                                        <div class="text-slate-500" x-text="fileInput.label"></div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                    
                    <!-- Standard Files Display -->
                    <template x-if="!currentTaskUsesLabeledFiles">
                        <div class="space-y-1.5">
                            <template x-for="(file, idx) in uploadedFiles" :key="idx">
                                <div class="flex items-center gap-2 text-xs">
                                    <span class="text-base" x-text="getFileIcon(file.type)"></span>
                                    <span class="font-medium text-slate-900 truncate flex-1" x-text="file.name"></span>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </div>
            
            <!-- Options Info -->
            <div x-show="Object.keys(directionOptions).length > 0 && Object.keys(selectedOptions).length > 0" class="bg-slate-50 rounded-lg p-3 border border-slate-200">
                <div class="text-xs font-semibold uppercase text-slate-400 mb-2">Options</div>
                <div class="space-y-2">
                    <template x-for="(option, key) in directionOptions" :key="key">
                        <div x-show="selectedOptions[key] !== undefined && selectedOptions[key] !== ''" class="text-xs">
                            <div class="text-slate-500 mb-0.5" x-text="option.label || key"></div>
                            <div class="font-medium text-slate-900" x-text="selectedOptions[key]"></div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
        
        <!-- Edit Button -->
        <div class="mt-auto pt-4 border-t border-slate-200">
            <button @click="reopenConfigModal()" 
                    class="w-full px-4 py-2.5 text-sm font-semibold text-slate-700 hover:text-slate-900 border border-slate-300 rounded-lg hover:bg-slate-50 transition-all">
                ✏️ Edit Configuration
            </button>
        </div>
    </div>
    
    <!-- EDITABLE SETUP VIEW (Landing Mode) -->
    <div x-show="!leftPanelCollapsed && viewMode === 'landing'" class="flex flex-col h-full">
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-xs font-bold uppercase text-slate-400">Setup</h3>
            <button @click="leftPanelCollapsed = true" class="text-slate-400 hover:text-slate-600">
                ←
            </button>
        </div>
        
        <div class="flex-1 overflow-y-auto space-y-4 pr-2" style="scrollbar-width: thin;">
            <div>
                <label class="text-xs font-semibold uppercase text-slate-400 mb-3 block">Task</label>
                <div class="relative mb-3">
                    <input type="text" 
                           x-model="taskSearch"
                           @input="filterTasks()"
                           placeholder="Search tasks..."
                           class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-lg focus:ring-1 focus:ring-blue-500 focus:border-blue-500 pl-9 bg-white transition-shadow">
                    <span class="absolute left-3 top-2.5 text-slate-400 text-sm">🔍</span>
                    <button x-show="taskSearch" @click="taskSearch = ''; filterTasks()" 
                            class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600 text-xs">✕</button>
                </div>
                <div class="flex flex-wrap gap-1.5 mb-3">
                    <button @click="selectedCategory = 'all'; filterTasks()" 
                            :class="selectedCategory === 'all' ? 'bg-slate-900 text-white' : 'bg-white text-slate-600 hover:bg-slate-50 border border-slate-200'"
                            class="px-2.5 py-1 rounded-md text-xs font-medium whitespace-nowrap transition-all">
                        All
                    </button>
                    <button @click="selectedCategory = 'ask'; filterTasks()" 
                            :class="selectedCategory === 'ask' ? 'bg-blue-600 text-white' : 'bg-white text-blue-700 hover:bg-blue-50 border border-blue-200'"
                            class="px-2.5 py-1 rounded-md text-xs font-medium whitespace-nowrap transition-all">
                        Ask
                    </button>
                    <button @click="selectedCategory = 'analyze'; filterTasks()" 
                            :class="selectedCategory === 'analyze' ? 'bg-purple-600 text-white' : 'bg-white text-purple-700 hover:bg-purple-50 border border-purple-200'"
                            class="px-2.5 py-1 rounded-md text-xs font-medium whitespace-nowrap transition-all">
                        Analyze
                    </button>
                    <button @click="selectedCategory = 'compare'; filterTasks()" 
                            :class="selectedCategory === 'compare' ? 'bg-green-600 text-white' : 'bg-white text-green-700 hover:bg-green-50 border border-green-200'"
                            class="px-2.5 py-1 rounded-md text-xs font-medium whitespace-nowrap transition-all">
                        Compare
                    </button>
                    <button @click="selectedCategory = 'create'; filterTasks()" 
                            :class="selectedCategory === 'create' ? 'bg-amber-600 text-white' : 'bg-white text-amber-700 hover:bg-amber-50 border border-amber-200'"
                            class="px-2.5 py-1 rounded-md text-xs font-medium whitespace-nowrap transition-all">
                        Create
                    </button>
                    <button @click="selectedCategory = 'update'; filterTasks()" 
                            :class="selectedCategory === 'update' ? 'bg-indigo-600 text-white' : 'bg-white text-indigo-700 hover:bg-indigo-50 border border-indigo-200'"
                            class="px-2.5 py-1 rounded-md text-xs font-medium whitespace-nowrap transition-all">
                        Update
                    </button>
                </div>
                <div class="space-y-1.5 max-h-80 overflow-y-auto pr-1" style="scrollbar-width: thin;">
                    <template x-for="task in filteredTasks" :key="task.key">
                        <button @click="selectTask(task.key)"
                             type="button"
                             :class="selectedTransform === task.key ? 'border-blue-500 bg-blue-50' : 'border-slate-200 hover:border-slate-300 hover:bg-slate-50'"
                             class="w-full text-left border rounded-lg p-2.5 transition-all duration-150">
                            <div class="flex items-start gap-2.5">
                                <div class="text-lg flex-shrink-0 mt-0.5" x-text="getTaskIcon(task)"></div>
                                <div class="flex-1 min-w-0">
                                    <div class="flex items-center justify-between gap-2 mb-1">
                                        <h4 class="text-sm font-semibold text-slate-900 truncate" x-text="task.name"></h4>
                                        <div x-show="selectedTransform === task.key" 
                                             class="text-blue-600 text-sm flex-shrink-0">
                                            ✓
                                        </div>
                                    </div>
                                    <p class="text-xs text-slate-500 line-clamp-2 mb-1.5 leading-relaxed" x-text="task.description"></p>
                                    <div class="flex items-center gap-1 flex-wrap text-xs text-slate-400">
                                        <span x-text="task.steps + ' steps'"></span>
                                        <span>·</span>
                                        <template x-for="(fileType, idx) in task.input_file_types.slice(0, 2)" :key="fileType">
                                            <span>
                                                <span x-text="fileType.toUpperCase()"></span>
                                                <span x-show="idx < Math.min(task.input_file_types.length, 2) - 1">, </span>
                                            </span>
                                        </template>
                                        <span x-show="task.requires_dual_upload" 
                                              class="px-1.5 py-0.5 rounded bg-purple-100 text-purple-700 font-medium text-xs">
                                            2 files
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </button>
                    </template>
                    
                    <div x-show="filteredTasks.length === 0" class="text-center py-8 text-slate-400">
                        <p class="text-sm">No tasks found</p>
                        <p class="text-xs mt-1">Try a different search or category</p>
                    </div>
                </div>
            </div>
            
            <div x-show="selectedTransform">
                <label class="text-xs font-semibold uppercase text-slate-400 mb-3 block">Files</label>
                <template x-if="currentTaskUsesLabeledFiles">
                    <div class="space-y-3">
                        <template x-for="(fileInput, idx) in currentTaskLabeledInputs" :key="fileInput.key">
                            <div class="bg-white border border-slate-200 rounded-lg p-3 space-y-2.5">
                                <!-- Label & Description -->
                                <div class="flex items-start justify-between gap-2">
                                    <div class="flex-1">
                                        <div class="flex items-center gap-2 mb-0.5">
                                            <span class="text-xs font-bold text-slate-400" x-text="(idx + 1)"></span>
                                            <h5 class="text-sm font-semibold text-slate-900" x-text="fileInput.label"></h5>
                                            <span x-show="fileInput.required" class="text-xs px-1.5 py-0.5 bg-blue-100 text-blue-700 rounded font-medium">Required</span>
                                        </div>
                                        <p class="text-xs text-slate-500" x-text="fileInput.description"></p>
                                    </div>
                                </div>
                                
                                <!-- Upload Status -->
                                <div x-show="labeledFiles[fileInput.key]" 
                                     class="flex items-center justify-between px-2.5 py-2 bg-emerald-50 border border-emerald-200 rounded-lg">
                                    <div class="flex items-center gap-2 text-xs min-w-0">
                                        <span class="text-emerald-600 flex-shrink-0">✓</span>
                                        <span class="text-base flex-shrink-0" x-text="getFileIcon(labeledFiles[fileInput.key]?.type || 'docx')"></span>
                                        <span class="font-medium text-slate-700 truncate" x-text="labeledFiles[fileInput.key]?.name"></span>
                                    </div>
                                    <button @click="removeLabeledFile(fileInput.key)" 
                                            class="text-xs text-red-600 hover:text-red-700 ml-2 flex-shrink-0">
                                        ×
                                    </button>
                                </div>
                                
                                <!-- Upload Button -->
                                <div x-show="!labeledFiles[fileInput.key]">
                                    <label :for="'file-input-' + fileInput.key" 
                                           class="flex items-center justify-center gap-2 px-3 py-2 border-2 border-dashed border-slate-300 rounded-lg hover:border-blue-400 hover:bg-blue-50 cursor-pointer transition-all text-sm text-slate-600 font-medium">
                                        <span>Choose file</span>
                                    </label>
                                    <input :id="'file-input-' + fileInput.key" 
                                           type="file" 
                                           @change="addLabeledFile($event, fileInput.key)" 
                                           :accept="currentTaskFileTypes"
                                           class="hidden">
                                </div>
                            </div>
                        </template>
                        
                        <!-- Progress Indicator -->
                        <div class="flex items-center gap-2 px-2.5 py-1.5 bg-slate-50 rounded-lg text-xs">
                            <span class="w-1.5 h-1.5 rounded-full" :class="allLabeledFilesUploaded ? 'bg-emerald-500' : 'bg-amber-400'"></span>
                            <span class="text-slate-600 font-medium" x-text="labeledFilesStatusText"></span>
                        </div>
                    </div>
                </template>
                
                <!-- Traditional File Inputs (for standard workflows) -->
                <template x-if="!currentTaskUsesLabeledFiles">
                    <div class="space-y-2">
                        <div class="space-y-1.5" x-show="uploadedFiles.length > 0">
                            <template x-for="(file, idx) in uploadedFiles" :key="idx">
                                <div class="px-2.5 py-2 bg-white rounded-lg border border-slate-200 flex items-center justify-between gap-2 text-xs">
                                    <div class="flex items-center gap-2 text-slate-600 min-w-0">
                                        <span class="text-base flex-shrink-0" x-text="getFileIcon(file.type)"></span>
                                        <p class="font-medium truncate" x-text="file.name"></p>
                                    </div>
                                    <button @click="removeFile(idx)" class="text-red-500 hover:text-red-700 flex-shrink-0">×</button>
                                </div>
                            </template>
                        </div>
                        <input type="file" @change="addFile" :accept="currentTaskFileTypes"
                               class="block w-full text-xs text-gray-500 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-900 file:text-white hover:file:bg-black transition-all">
                        <div x-show="uploadedFiles.length === 0" class="text-xs text-slate-400 mt-1" x-text="currentTaskFileHint"></div>
                        <div class="text-xs mt-1.5 flex items-center gap-1.5" x-show="uploadedFiles.length > 0 && !filesMatchTask">
                            <span class="text-amber-500">⚠</span>
                            <span class="text-amber-600" x-text="filesMismatchMessage"></span>
                        </div>
                        <div class="text-xs mt-1.5 flex items-center gap-1.5" x-show="uploadedFiles.length > 0 && filesMatchTask">
                            <span class="text-emerald-500">✓</span>
                            <span class="text-emerald-600 font-medium" x-text="currentTaskRequiresDual && uploadedFiles.length === 2 ? 'Both files ready' : 'File ready'"></span>
                        </div>
                    </div>
                </template>
            </div>
            
            <!-- Task Options -->
            <div x-show="selectedTransform && (uploadedFiles.length > 0 || allLabeledFilesUploaded) && Object.keys(directionOptions).length > 0">
                <label class="text-xs font-semibold uppercase text-slate-400 mb-3 block">Options</label>
                <div class="space-y-3">
                    <template x-for="(option, key) in directionOptions" :key="key">
                        <div class="option-field space-y-1.5">
                            <label class="text-xs font-semibold text-slate-700 block flex items-center gap-2">
                                <span x-text="option.label || key"></span>
                                <!-- Type icon -->
                                <span class="text-xs opacity-60" x-show="option.type === 'number'">🔢</span>
                                <span class="text-xs opacity-60" x-show="option.type === 'checkbox'">✓</span>
                                <span class="text-xs opacity-60" x-show="option.type === 'text'">📝</span>
                                <span class="text-xs opacity-60" x-show="option.type === 'textarea'">📄</span>
                            </label>
                            
                            <!-- Select/Dropdown (default) -->
                            <div x-show="!option.type || option.type === 'select'">
                                <select class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:ring-1 focus:ring-blue-500 focus:border-blue-500 bg-white transition-shadow"
                                        x-model="selectedOptions[key]">
                                    <option value="">Select...</option>
                                    <template x-for="choice in option.choices" :key="choice.value">
                                        <option :value="choice.value" x-text="choice.label"></option>
                                    </template>
                                </select>
                            </div>
                            
                            <!-- Number Input -->
                            <div x-show="option.type === 'number'" class="space-y-2">
                                <input type="number" 
                                       class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-all"
                                       x-model.number="selectedOptions[key]"
                                       :min="option.min"
                                       :max="option.max"
                                       :step="option.step"
                                       :placeholder="option.default">
                                <!-- Range indicator -->
                                <div class="flex items-center gap-2 text-xs text-slate-500">
                                    <span x-text="option.min"></span>
                                    <div class="flex-1 h-1 bg-slate-200 rounded-full relative overflow-hidden">
                                        <div class="h-full bg-blue-500 rounded-full transition-all" 
                                             :style="`width: ${Math.max(0, Math.min(100, ((selectedOptions[key] - option.min) / (option.max - option.min)) * 100))}%`"></div>
                                    </div>
                                    <span x-text="option.max"></span>
                                </div>
                            </div>
                            
                            <!-- Checkbox -->
                            <div x-show="option.type === 'checkbox'">
                                <label class="flex items-center gap-2 px-3 py-2 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-50 transition-all">
                                    <input type="checkbox" 
                                           class="w-4 h-4 text-blue-600 rounded focus:ring-2 focus:ring-blue-500"
                                           x-model="selectedOptions[key]">
                                    <span class="text-sm text-slate-700" x-text="option.label"></span>
                                </label>
                            </div>
                            
                            <!-- Text Input -->
                            <div x-show="option.type === 'text'">
                                <input type="text" 
                                       class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-all"
                                       x-model="selectedOptions[key]"
                                       :placeholder="option.placeholder || 'Enter text...'"
                                       :maxlength="option.maxLength">
                            </div>
                            
                            <!-- Textarea -->
                            <div x-show="option.type === 'textarea'" class="space-y-1">
                                <textarea 
                                    class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-all resize-none"
                                    x-model="selectedOptions[key]"
                                    :rows="option.rows || 4"
                                    :placeholder="option.placeholder || 'Enter text...'"
                                    :maxlength="option.maxLength"></textarea>
                                <!-- Character counter -->
                                <div class="text-xs text-right text-slate-400" x-show="option.maxLength">
                                    <span x-text="(selectedOptions[key] || '').length"></span>/<span x-text="option.maxLength"></span>
                                </div>
                            </div>
                            
                            <p class="text-xs text-slate-500" x-show="option.description" x-text="option.description"></p>
                        </div>
                    </template>
                </div>
            </div>
        </div>
        
        <!-- Action Button -->
        <div class="mt-auto pt-4 border-t border-slate-200 space-y-3">
            <button @click="runDraft()" 
                    :disabled="!canRunTask()"
                    class="primary-button w-full">
                <span x-show="!processing">Start</span>
                <span x-show="processing">Working...</span>
            </button>
            
            <!-- Status Indicator -->
            <div class="flex items-center justify-between text-xs bg-slate-50 rounded-lg px-2.5 py-2">
                <div class="flex items-center gap-2 text-slate-600">
                    <span class="w-1.5 h-1.5 rounded-full" :class="processing ? 'bg-amber-500 animate-pulse' : uploadedFiles.length > 0 ? 'bg-emerald-500' : 'bg-slate-300'"></span>
                    <span x-text="processing ? 'Working...' : 
                                 !selectedTransform ? 'Pick a task' :
                                 (uploadedFiles.length === 0 && Object.keys(labeledFiles).length === 0) ? 'Add files' :
                                 !areOptionsValid() ? 'Set options' : 
                                 'Ready'"></span>
                </div>
                <span x-show="uploadedFiles.length > 0 || Object.keys(labeledFiles).length > 0" 
                      class="text-slate-500 font-medium"
                      x-text="currentTaskUsesLabeledFiles ? `${Object.keys(labeledFiles).length} file${Object.keys(labeledFiles).length > 1 ? 's' : ''}` : `${uploadedFiles.length} file${uploadedFiles.length > 1 ? 's' : ''}`"></span>
            </div>
        </div>
    </div>
</div>
