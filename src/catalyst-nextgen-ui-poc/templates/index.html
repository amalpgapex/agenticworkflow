<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://unpkg.com/turndown/dist/turndown.js"></script>
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body class="bg-gray-50" x-data="appData()" @keydown.window="handleKeydown($event)">
    
    <!-- Top Navigation Bar -->
    <div class="bg-white border-b border-gray-200 px-8 py-3">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="w-8 h-8 rounded-lg bg-black text-white flex items-center justify-center text-sm font-semibold">InK</div>
                <h1 class="text-lg font-semibold text-gray-900 tracking-tight">Studio</h1>
            </div>
            <div class="flex gap-2">
                <button @click="currentView = 'workflow'" 
                        :class="currentView === 'workflow' ? 'bg-slate-900 text-white' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-50'"
                        class="px-3 py-1.5 rounded-lg text-sm font-medium transition">
                    Workspace
                </button>
                <button @click="currentView = 'manager'" 
                        :class="currentView === 'manager' ? 'bg-slate-900 text-white' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-50'"
                        class="px-3 py-1.5 rounded-lg text-sm font-medium transition">
                    Library
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="max-w-[1800px] mx-auto px-6 py-6">
        
        <!-- LANDING PAGE VIEW -->
        <div x-show="currentView === 'workflow' && viewMode === 'landing'" 
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             x-transition:leave="transition ease-in duration-300"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0"
             x-cloak>
            
            <div class="landing-container">
                <!-- Hero Search Bar -->
                <div class="mb-8">
                    <input type="text" 
                           x-model="landingSearch"
                           @keydown="handleLandingSearchKeydown($event)"
                           placeholder="What is your goal?"
                           class="landing-search w-full px-6 py-4 text-lg border-2 border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all shadow-sm">
                </div>
                
                <!-- Category Filters -->
                <div class="flex items-center gap-3 mb-10 flex-wrap">
                    <button @click="selectCategory('all')" 
                            :class="selectedCategory === 'all' ? 'bg-slate-900 text-white shadow-md' : 'bg-white text-slate-700 hover:bg-slate-50 border-2 border-slate-200'"
                            class="px-5 py-2 rounded-full text-sm font-semibold transition-all duration-200">
                        All Tasks
                    </button>
                    <button @click="selectCategory('ask')" 
                            :class="selectedCategory === 'ask' ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-blue-700 hover:bg-blue-50 border-2 border-blue-200'"
                            class="px-5 py-2 rounded-full text-sm font-semibold transition-all duration-200">
                        💬 Ask
                    </button>
                    <button @click="selectCategory('analyze')" 
                            :class="selectedCategory === 'analyze' ? 'bg-purple-600 text-white shadow-md' : 'bg-white text-purple-700 hover:bg-purple-50 border-2 border-purple-200'"
                            class="px-5 py-2 rounded-full text-sm font-semibold transition-all duration-200">
                        🔍 Analyze
                    </button>
                    <button @click="selectCategory('compare')" 
                            :class="selectedCategory === 'compare' ? 'bg-green-600 text-white shadow-md' : 'bg-white text-green-700 hover:bg-green-50 border-2 border-green-200'"
                            class="px-5 py-2 rounded-full text-sm font-semibold transition-all duration-200">
                        🔗 Compare
                    </button>
                    <button @click="selectCategory('create')" 
                            :class="selectedCategory === 'create' ? 'bg-amber-600 text-white shadow-md' : 'bg-white text-amber-700 hover:bg-amber-50 border-2 border-amber-200'"
                            class="px-5 py-2 rounded-full text-sm font-semibold transition-all duration-200">
                        🎨 Create
                    </button>
                    <button @click="selectCategory('update')" 
                            :class="selectedCategory === 'update' ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-indigo-700 hover:bg-indigo-50 border-2 border-indigo-200'"
                            class="px-5 py-2 rounded-full text-sm font-semibold transition-all duration-200">
                        ♻️ Update
                    </button>
                </div>
                
                <!-- Task Grid -->
                <div class="task-grid">
                    <template x-for="task in landingFilteredTasks" :key="task.key">
                        <div @click="selectTask(task.key)"
                             :class="selectedTransform === task.key ? 'border-blue-500 bg-blue-50 shadow-lg' : 'border-slate-200 hover:border-slate-300'"
                             class="task-tile group cursor-pointer">
                            <div class="flex items-start gap-4 mb-3">
                                <div class="text-3xl flex-shrink-0" x-text="getTaskIcon(task)"></div>
                                <div class="flex-1 min-w-0">
                                    <h3 class="text-base font-semibold text-slate-900 mb-1 group-hover:text-blue-600 transition-colors" x-text="task.name"></h3>
                                    <p class="text-sm text-slate-600 line-clamp-2 leading-relaxed" x-text="task.description"></p>
                                </div>
                            </div>
                            <div class="pt-3 border-t border-slate-100 flex items-center gap-2 text-xs text-slate-500">
                                <span x-text="task.steps + ' steps'" class="font-medium"></span>
                                <span>·</span>
                                <div class="flex gap-1">
                                    <template x-for="(fileType, idx) in task.input_file_types.slice(0, 3)" :key="fileType">
                                        <span class="px-2 py-0.5 rounded bg-slate-100 text-slate-700 font-medium uppercase text-xs" x-text="fileType"></span>
                                    </template>
                                </div>
                                <span x-show="task.requires_dual_upload" 
                                      class="ml-auto px-2 py-0.5 rounded-full bg-purple-100 text-purple-700 font-semibold text-xs">
                                    2 files
                                </span>
                            </div>
                        </div>
                    </template>
                    
                    <!-- Empty State -->
                    <div x-show="landingFilteredTasks.length === 0" 
                         class="col-span-full text-center py-16">
                        <div class="text-5xl mb-4">🔍</div>
                        <h3 class="text-xl font-semibold text-slate-700 mb-2">No tasks found</h3>
                        <p class="text-slate-500">Try adjusting your search or selecting a different category</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- CONFIGURATION MODAL -->
        <div x-show="showConfigModal" 
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0"
             class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 px-4"
             @click.self="closeConfigModal()"
             x-cloak>
            
            <div x-show="showConfigModal"
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="opacity-0 scale-95"
                 x-transition:enter-end="opacity-100 scale-100"
                 x-transition:leave="transition ease-in duration-200"
                 x-transition:leave-start="opacity-100 scale-100"
                 x-transition:leave-end="opacity-0 scale-95"
                 class="bg-white rounded-3xl shadow-2xl max-w-2xl w-full max-h-[80vh] overflow-hidden flex flex-col"
                 @click.stop>
                
                <!-- Modal Header -->
                <div class="px-8 py-6 border-b border-slate-200 flex items-start justify-between">
                    <div class="flex-1">
                        <h2 class="text-2xl font-bold text-slate-900 mb-1" x-text="transformations.find(t => t.key === selectedTransform)?.name || 'Configure Task'"></h2>
                        <p class="text-sm text-slate-600" x-text="transformations.find(t => t.key === selectedTransform)?.description || ''"></p>
                    </div>
                    <button @click="closeConfigModal()" 
                            class="ml-4 text-slate-400 hover:text-slate-600 transition-colors text-2xl leading-none">
                        ×
                    </button>
                </div>
                
                <!-- Modal Body -->
                <div class="flex-1 overflow-y-auto px-8 py-6 space-y-6">
                    <!-- Files Section -->
                    <div>
                        <h3 class="text-sm font-bold uppercase text-slate-400 mb-3">Upload Files</h3>
                        
                        <!-- Labeled Files -->
                        <template x-if="currentTaskUsesLabeledFiles">
                            <div class="space-y-3">
                                <template x-for="(fileInput, idx) in currentTaskLabeledInputs" :key="fileInput.key">
                                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-3">
                                        <div class="flex items-start justify-between gap-2">
                                            <div class="flex-1">
                                                <div class="flex items-center gap-2 mb-1">
                                                    <span class="text-xs font-bold text-slate-400" x-text="(idx + 1)"></span>
                                                    <h5 class="text-sm font-semibold text-slate-900" x-text="fileInput.label"></h5>
                                                    <span x-show="fileInput.required" class="text-xs px-2 py-0.5 bg-blue-100 text-blue-700 rounded-full font-medium">Required</span>
                                                </div>
                                                <p class="text-xs text-slate-600" x-text="fileInput.description"></p>
                                            </div>
                                        </div>
                                        
                                        <div x-show="labeledFiles[fileInput.key]" 
                                             class="flex items-center justify-between px-3 py-2.5 bg-emerald-50 border border-emerald-200 rounded-lg">
                                            <div class="flex items-center gap-2 text-sm min-w-0">
                                                <span class="text-emerald-600 flex-shrink-0">✓</span>
                                                <span class="text-lg flex-shrink-0" x-text="getFileIcon(labeledFiles[fileInput.key]?.type || 'docx')"></span>
                                                <span class="font-medium text-slate-700 truncate" x-text="labeledFiles[fileInput.key]?.name"></span>
                                            </div>
                                            <button @click="removeLabeledFile(fileInput.key)" 
                                                    class="text-sm text-red-600 hover:text-red-700 ml-2 flex-shrink-0">
                                                ×
                                            </button>
                                        </div>
                                        
                                        <div x-show="!labeledFiles[fileInput.key]">
                                            <label :for="'modal-file-input-' + fileInput.key" 
                                                   class="flex items-center justify-center gap-2 px-4 py-3 border-2 border-dashed border-slate-300 rounded-lg hover:border-blue-400 hover:bg-blue-50 cursor-pointer transition-all text-sm text-slate-600 font-medium">
                                                <span>📁 Choose file</span>
                                            </label>
                                            <input :id="'modal-file-input-' + fileInput.key" 
                                                   type="file" 
                                                   @change="addLabeledFile($event, fileInput.key)" 
                                                   :accept="currentTaskFileTypes"
                                                   class="hidden">
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                        
                        <!-- Standard Files -->
                        <template x-if="!currentTaskUsesLabeledFiles">
                            <div class="space-y-3">
                                <div class="space-y-2" x-show="uploadedFiles.length > 0">
                                    <template x-for="(file, idx) in uploadedFiles" :key="idx">
                                        <div class="px-3 py-2.5 bg-slate-50 rounded-lg border border-slate-200 flex items-center justify-between gap-2">
                                            <div class="flex items-center gap-2 text-slate-700 min-w-0">
                                                <span class="text-lg flex-shrink-0" x-text="getFileIcon(file.type)"></span>
                                                <p class="font-medium truncate text-sm" x-text="file.name"></p>
                                            </div>
                                            <button @click="removeFile(idx)" class="text-red-500 hover:text-red-700 flex-shrink-0">×</button>
                                        </div>
                                    </template>
                                </div>
                                <label for="modal-standard-file" 
                                       class="flex items-center justify-center gap-2 px-4 py-3 border-2 border-dashed border-slate-300 rounded-lg hover:border-blue-400 hover:bg-blue-50 cursor-pointer transition-all text-sm text-slate-600 font-medium">
                                    <span>📁 Choose file</span>
                                </label>
                                <input id="modal-standard-file" type="file" @change="addFile" :accept="currentTaskFileTypes"
                                       class="hidden">
                                <div x-show="uploadedFiles.length === 0" class="text-xs text-slate-500 mt-2" x-text="currentTaskFileHint"></div>
                            </div>
                        </template>
                    </div>
                    
                    <!-- Options Section -->
                    <div x-show="Object.keys(directionOptions).length > 0">
                        <h3 class="text-sm font-bold uppercase text-slate-400 mb-3">Configuration</h3>
                        <div class="space-y-4">
                            <template x-for="(option, key) in directionOptions" :key="key">
                                <div class="option-field space-y-2">
                                    <label class="text-sm font-semibold text-slate-700 block" x-text="option.label || key"></label>
                                    <div x-show="option.description" class="text-xs text-slate-500 -mt-1 mb-2" x-text="option.description"></div>
                                    
                                    <!-- Select -->
                                    <div x-show="!option.type || option.type === 'select'">
                                        <select class="w-full px-3 py-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white transition-all"
                                                x-model="selectedOptions[key]">
                                            <option value="">Select...</option>
                                            <template x-for="choice in option.choices" :key="choice.value">
                                                <option :value="choice.value" x-text="choice.label"></option>
                                            </template>
                                        </select>
                                    </div>
                                    
                                    <!-- Number -->
                                    <div x-show="option.type === 'number'" class="space-y-2">
                                        <input type="number" 
                                               class="w-full px-3 py-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
                                               x-model.number="selectedOptions[key]"
                                               :min="option.min"
                                               :max="option.max"
                                               :step="option.step"
                                               :placeholder="String(option.default || '')">
                                    </div>
                                    
                                    <!-- Checkbox -->
                                    <div x-show="option.type === 'checkbox'">
                                        <label class="flex items-center gap-2 px-3 py-2.5 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-50 transition-all">
                                            <input type="checkbox" 
                                                   class="w-4 h-4 text-blue-600 rounded focus:ring-2 focus:ring-blue-500"
                                                   x-model="selectedOptions[key]">
                                            <span class="text-sm text-slate-700" x-text="option.label"></span>
                                        </label>
                                    </div>
                                    
                                    <!-- Text -->
                                    <div x-show="option.type === 'text'">
                                        <input type="text" 
                                               class="w-full px-3 py-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
                                               x-model="selectedOptions[key]"
                                               :placeholder="option.placeholder || 'Enter text...'">
                                    </div>
                                    
                                    <!-- Textarea -->
                                    <div x-show="option.type === 'textarea'">
                                        <textarea 
                                            class="w-full px-3 py-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all resize-y"
                                            x-model="selectedOptions[key]"
                                            :rows="option.rows || 3"
                                            :maxlength="option.maxLength"
                                            :placeholder="option.placeholder || 'Enter text...'"></textarea>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
                
                <!-- Modal Footer -->
                <div class="px-8 py-5 border-t border-slate-200 flex items-center justify-between bg-slate-50">
                    <button @click="closeConfigModal()" 
                            class="px-5 py-2.5 text-sm font-semibold text-slate-700 hover:text-slate-900 transition-colors">
                        Cancel
                    </button>
                    <button @click="startWorkflow()" 
                            :disabled="!filesMatchTask && !allLabeledFilesUploaded"
                            :class="(filesMatchTask || allLabeledFilesUploaded) ? 'bg-slate-900 hover:bg-black' : 'bg-slate-300 cursor-not-allowed'"
                            class="px-6 py-2.5 text-sm font-semibold text-white rounded-lg transition-all shadow-md">
                        <span x-text="viewMode === 'workspace' ? 'Apply Changes & Rerun →' : 'Start Workflow →'"></span>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- WORKFLOW VIEW: Three Column Layout -->
        <div x-show="currentView === 'workflow' && viewMode === 'workspace'" 
             x-transition:enter="transition ease-out duration-400"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             x-cloak>
            <div style="display: flex; gap: 1.5rem; height: calc(100vh - 120px);">
                
                <!-- Column 1: Setup Panel - Context-aware sizing -->
                <div id="setup-panel" 
                     style="width: 50%; min-width: 60px; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1), min-width 0.5s cubic-bezier(0.4, 0, 0.2, 1); will-change: width;">
                    <!-- Content loaded by JavaScript -->
                </div>

                <!-- Column 2: Canvas Panel -->
                <div id="canvas-panel" 
                     style="flex: 1; min-width: 300px; transition: flex 0.5s cubic-bezier(0.4, 0, 0.2, 1); opacity: 0.5;">
                    <!-- Content loaded by JavaScript -->
                </div>

                <!-- Column 3: Actions Panel - Initially minimal -->
                <div id="actions-panel" 
                     style="width: 0px; opacity: 0; min-width: 0px; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), min-width 0.5s cubic-bezier(0.4, 0, 0.2, 1); will-change: width; overflow: hidden;">
                    <!-- Content loaded by JavaScript -->
                </div>

            </div>
        </div>
        
        <!-- MANAGER VIEW: Library -->
        <div x-show="currentView === 'manager'" x-cloak id="manager-view">
            <!-- Content loaded by JavaScript -->
        </div>

    </div>

    <!-- Load Application State & Functions -->
    <script src="/static/js/app.js?v=2.7"></script>
    
    <!-- Load Panel Components -->
    <script>
        // Simple component loader
        async function loadPanel(panelId, componentFile) {
            try {
                const response = await fetch(`/static/components/${componentFile}`);
                if (response.ok) {
                    const html = await response.text();
                    document.getElementById(panelId).innerHTML = html;
                }
            } catch (error) {
                console.error(`Error loading ${componentFile}:`, error);
            }
        }

        // Load all panels when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            loadPanel('setup-panel', 'setup_panel.html');
            loadPanel('canvas-panel', 'canvas_panel.html');
            loadPanel('actions-panel', 'actions_panel.html');
            loadPanel('manager-view', 'manager_view.html');
        });

        // Handle context-aware panel sizing with smooth transitions
        document.addEventListener('alpine:init', () => {
            // Track panel states
            let lastLeftState = false;
            let lastRightState = false;
            let lastWorkflowActive = false;
            
            setInterval(() => {
                // Get Alpine data
                const alpineData = window.Alpine?.$data(document.querySelector('[x-data]'));
                if (!alpineData) return;
                
                // Only apply panel sizing in workspace mode
                if (alpineData.viewMode !== 'workspace') return;
                
                const setupPanel = document.getElementById('setup-panel');
                const canvasPanel = document.getElementById('canvas-panel');
                const actionsPanel = document.getElementById('actions-panel');
                
                if (!setupPanel || !canvasPanel || !actionsPanel) return;
                
                // Check if workflow is active (has steps or output)
                const hasSteps = alpineData.steps && alpineData.steps.length > 0;
                const hasOutput = alpineData.stepOutputs && alpineData.stepOutputs.length > 0;
                const workflowActive = hasSteps || hasOutput;
                
                const leftCollapsed = alpineData.leftPanelCollapsed;
                const rightCollapsed = alpineData.rightPanelCollapsed;
                
                // Context-aware sizing based on workflow state
                if (workflowActive !== lastWorkflowActive) {
                    if (workflowActive) {
                        // Workflow started - switch to working layout
                        setupPanel.style.width = leftCollapsed ? '60px' : '350px';
                        actionsPanel.style.width = rightCollapsed ? '60px' : '350px';
                        actionsPanel.style.opacity = '1';
                        actionsPanel.style.overflow = rightCollapsed ? 'hidden' : 'visible';
                        canvasPanel.style.opacity = '1';
                    } else {
                        // No workflow - setup-focused layout
                        setupPanel.style.width = leftCollapsed ? '60px' : '50%';
                        actionsPanel.style.width = '0px';
                        actionsPanel.style.opacity = '0';
                        actionsPanel.style.overflow = 'hidden';
                        canvasPanel.style.opacity = '0.5';
                    }
                    lastWorkflowActive = workflowActive;
                }
                
                // Manual panel collapse/expand (only when workflow is active)
                if (workflowActive) {
                    if (leftCollapsed !== lastLeftState) {
                        setupPanel.style.width = leftCollapsed ? '60px' : '350px';
                        setupPanel.style.overflow = 'hidden';
                        setTimeout(() => {
                            setupPanel.style.overflow = leftCollapsed ? 'hidden' : 'visible';
                        }, 500);
                        lastLeftState = leftCollapsed;
                    }
                    
                    if (rightCollapsed !== lastRightState) {
                        actionsPanel.style.width = rightCollapsed ? '60px' : '350px';
                        actionsPanel.style.overflow = 'hidden';
                        setTimeout(() => {
                            actionsPanel.style.overflow = rightCollapsed ? 'hidden' : 'visible';
                        }, 500);
                        lastRightState = rightCollapsed;
                    }
                } else {
                    // In setup mode, only allow left panel collapse
                    if (leftCollapsed !== lastLeftState) {
                        setupPanel.style.width = leftCollapsed ? '60px' : '50%';
                        setupPanel.style.overflow = 'hidden';
                        setTimeout(() => {
                            setupPanel.style.overflow = leftCollapsed ? 'hidden' : 'visible';
                        }, 500);
                        lastLeftState = leftCollapsed;
                    }
                }
            }, 50); // Check every 50ms for smooth response
        });
    </script>
</body>
</html>
